name: CI

# Every pull request and every push to main: lint, the production build
# (which runs the dash check first), then the smoke tests against that build.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      # The browser only, from Playwright's download host. Not --with-deps:
      # that runs apt first, and the runner's package mirrors are not
      # reliably reachable, while the libraries Chromium needs already ship
      # on the hosted Ubuntu image (it carries Google Chrome).
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install chromium

      - run: pnpm test:e2e

      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
